<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookHub - Modern Library Management</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Custom CSS for Premium Styling -->
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #6f42c1;
      --accent-color: #20c997;
      --light-bg: #f8f9fa;
      --dark-text: #2d3436;
      --soft-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --hover-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-accent: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --glass-bg: rgba(0, 0, 0, 0.25);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: var(--dark-text);
      line-height: 1.6;
    }

    .glass-effect {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
    }

    .modern-card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--soft-shadow);
      border: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .modern-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--hover-shadow);
    }

    .modern-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-primary);
    }

    .btn-modern {
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 500;
      text-transform: none;
      transition: all 0.3s ease;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
    }

    .btn-accent {
      background: var(--gradient-accent);
      color: white;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      border: 2px solid #e9ecef;
      padding: 14px 16px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.2rem rgba(32, 201, 151, 0.25);
      transform: translateY(-1px);
    }

    .sidebar {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      margin: 4px 0;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transform: translateX(8px);
    }

    .navbar {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }

    .table {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--soft-shadow);
    }

    .table th {
      background: var(--light-bg);
      font-weight: 600;
      border: none;
      padding: 16px;
    }

    .table td {
      border: none;
      padding: 16px;
      vertical-align: middle;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 12px;
    }

    .stats-card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      box-shadow: var(--soft-shadow);
      transition: all 0.3s ease;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .stats-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--hover-shadow);
    }

    .stats-card .icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 24px;
      color: white;
    }

    .stats-card.primary .icon {
      background: var(--gradient-primary);
    }

    .stats-card.accent .icon {
      background: var(--gradient-accent);
    }

    .stats-card.success .icon {
      background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
    }

    .stats-card.warning .icon {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .login-container,
    .register-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 450px;
      width: 100%;
    }

    .hero-section {
      background: var(--gradient-primary);
      color: white;
      padding: 6rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="rgba(255,255,255,0.1)"><polygon points="1000,100 1000,0 0,100"/></svg>') no-repeat bottom;
      background-size: cover;
    }

    .floating-animation {
      animation: floating 6s ease-in-out infinite;
    }

    @keyframes floating {
      0% {
        transform: translate(0, 0px);
      }

      50% {
        transform: translate(0, -20px);
      }

      100% {
        transform: translate(0, 0px);
      }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide-in {
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        position: fixed;
        z-index: 1000;
        width: 280px;
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .modern-card {
        padding: 1.5rem;
      }

      .auth-card {
        padding: 2rem;
        margin: 1rem;
      }

      .hero-section {
        padding: 4rem 0;
      }
    }

    .content-wrapper {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 2rem;
      margin: 2rem;
      min-height: calc(100vh - 4rem);
    }

    .page-header {
      background: white;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--soft-shadow);
      border-left: 4px solid var(--accent-color);
    }

    .action-buttons {
      gap: 12px;
    }

    .action-buttons .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-content {
      border-radius: 20px;
      border: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      background: var(--light-bg);
      border-bottom: 1px solid #e9ecef;
      border-radius: 20px 20px 0 0;
      padding: 1.5rem 2rem;
    }

    .modal-body {
      padding: 2rem;
    }

    .alert {
      border-radius: 12px;
      border: none;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .search-box {
      position: relative;
      margin-bottom: 2rem;
    }

    .search-box input {
      padding-left: 3rem;
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 50px;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
